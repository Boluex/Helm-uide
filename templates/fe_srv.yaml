apiVersion: v1
kind: Service
metadata:
  name: {{ include "robotshop.fullname" . }}-fe
  namespace: robotshop
  labels:
    {{- include "robotshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: fe
spec:
  type: {{ .Values.fe_service.type }}
  ports:
    - port: {{ .Values.fe_service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "robotshop.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: fe
