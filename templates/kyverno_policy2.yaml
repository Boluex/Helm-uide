apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: require-image-digest
spec:
  validationFailureAction: Enforce
  rules:
  - name: check-image-digest
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Pods must have an image digest"
      pattern:
        spec:
          containers:
          - image: "?*"