apiVersion: v1
kind: Service
metadata:
  name: {{ include "robotshop.fullname" . }}-db
  namespace: robotshop
  labels:
    {{- include "robotshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  type: {{ .Values.db_service.type }}
  clusterIP: None
  ports:
    - port: {{ .Values.db_service.port }}
      targetPort: tcp
      protocol: TCP
      name: tcp
  selector:
    {{- include "robotshop.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: db
    