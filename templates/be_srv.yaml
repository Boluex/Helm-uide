apiVersion: v1
kind: Service
metadata:
  name: {{ include "robotshop.fullname" . }}-be
  namespace: robotshop
  labels:
    {{- include "robotshop.labels" . | nindent 4 }}
    app.kubernetes.io/component: be
spec:
  type: {{ .Values.be_service.type }}
  ports:
    - port: {{ .Values.be_service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "robotshop.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: be
